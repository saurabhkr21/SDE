<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #formTodo {
            margin-bottom: 20px;
        }
        #inputTodo {
            padding: 10px;
            width: 300px;
        }
        #submitTodo {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        #submitTodo:hover {
            background-color: #0056b3;
        }
        #todoContainer {
            padding: 10px;
            border-radius: 5px;
        }
        .todo-item {
            width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
        
    </style>
    
</head>
<body>
    <form id="formTodo">
        <input type="text" id="inputTodo">
        <button type="submit" id="submitTodo">Submit</button>
    </form>
    <div id="todoContainer" style="background-color: aqua;" ></div>
</body>
<script src="D17.js"></script>
</html>
